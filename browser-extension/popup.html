<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090b;
      color: #fafafa;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid #27272a;
    }
    .logo { font-size: 18px; font-weight: 700; color: #a78bfa; }
    .subtitle { font-size: 12px; color: #71717a; }
    .section { padding: 12px 16px; }
    .section-title { font-size: 11px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .page-info { font-size: 12px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 12px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 8px;
    }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-secondary { background: #27272a; color: #fafafa; }
    .btn-secondary:hover { background: #3f3f46; }
    .status { padding: 8px 16px 12px; font-size: 12px; color: #22c55e; display: none; }
    .status.error { color: #ef4444; }
    .divider { height: 1px; background: #27272a; }
    .footer { padding: 10px 16px; font-size: 11px; color: #52525b; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="logo">⚡ AIFlow</div>
      <div class="subtitle">AI 데스크톱 허브</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">현재 페이지</div>
    <div class="page-info" id="page-title">로딩 중...</div>
    <button class="btn btn-primary" id="btn-send-page">
      📄 이 페이지를 AIFlow로 전송
    </button>
    <button class="btn btn-secondary" id="btn-send-selection">
      ✂️ 선택한 텍스트 전송
    </button>
  </div>

  <div class="divider"></div>

  <div id="status" class="status"></div>

  <div class="footer">AIFlow와 연결됨 · v1.0</div>

  <script src="popup.js"></script>
</body>
</html>

# ─────────────────────────────────────────────────────────────────
#  AIFlow — CI Check Workflow
#  Trigger  : push to main / feat/** / fix/**
#             pull_request targeting main or feat/**
#  Jobs     : TypeScript type-check  +  Rust cargo check
#  Security : read-only permissions, npm audit, reproducible deps
# ─────────────────────────────────────────────────────────────────

name: Check

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

# Read-only — no release or write operations
permissions:
  contents: read

jobs:
  # ── Frontend: TypeScript type check ──────────────────────────────
  frontend:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # Catch HIGH or CRITICAL vulnerabilities in frontend deps
      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true   # warn only on PRs (non-blocking)

  # ── Rust: cargo check ────────────────────────────────────────────
  # Run on Windows — screenshots crate requires Windows APIs
  rust:
    name: Rust Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      # Lint: catch common Rust mistakes
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --target x86_64-pc-windows-msvc -- -D warnings
        continue-on-error: true   # warn only; will tighten after first clean pass
